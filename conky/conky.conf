-- Conky, a system monitor https://github.com/brndnmtthws/conky
--
-- This configuration file is Lua code. You can write code in here, and it will
-- execute when Conky loads. You can use it to generate your own advanced
-- configurations.
--
-- Try this (remove the `--`):
--
--   print("Loading Conky config")
--
-- For more on Lua, see:
-- https://www.lua.org/pil/contents.html
--
-- Conky Lua API: https://conky.cc/lua

-- Configuration settings: https://conky.cc/config_settings
conky.config = {
    alignment = 'bottom_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#e6e0f8',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=9',
    gap_x = 60,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,
    own_window = true,
    own_window_color = '#4d000000',   -- ~30% dark glass tint; picom blurs it (class_g = 'Conky' rule)
    own_window_class = 'Conky',
    -- 'override': i3 does not manage override-redirect windows at all, so conky
    -- stays as a plain root child and conky keeps it BELOW managed windows.
    -- ('desktop' does NOT work in i3 — it auto-floats those windows, i3/i3#903)
    own_window_type = 'override',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    lua_load = '~/.config/conky/graph.lua',
}

-- Variables: https://conky.cc/variables
conky.text = [[
${font DejaVu Sans Mono:size=24}${alignc 12}${time %H:%M}
${font DejaVu Sans Mono:size=9}${time %A %d %B %Y}
${color #b18cff}Info:$color ${scroll 32 Conky $conky_version - $sysname $nodename $kernel $machine}
${color #a78bfa}General ${hr 1}
${color #9a8fb8}Uptime:$color $uptime
${color #9a8fb8}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 10}
${color #9a8fb8}File systems: $color${fs_used /}/${fs_size /} ${fs_bar 10 /}

${color #a78bfa}Processes ${hr 1}
${color #b18cff}RAM Usage:$color $memperc% ${membar 10, 70} $mem/$memmax
${color #b18cff}CPU Usage:$color $cpu% ${cpubar 10}
${color #b18cff}Name                   PID    CPU%   MEM%
${color #b8b3cc}${top name 1}    ${top pid 1} ${top cpu 1} ${top mem 1}
${color #b8b3cc}${top name 2}    ${top pid 2} ${top cpu 2} ${top mem 2}
${color #b8b3cc}${top name 3}    ${top pid 3} ${top cpu 3} ${top mem 3}
${color #b8b3cc}${top name 4}    ${top pid 4} ${top cpu 4} ${top mem 4}
${cpugraph 30, gradient colour 2 -t -l}
${color #9a8fb8}Frequency:$color $freq MHz
${color #9a8fb8}Processes:$color $processes  ${color #9a8fb8}Running:$color $running_processes

${color #a78bfa}GPU ${hr 1}
${color #b18cff}VRAM :$color ${exec nvidia-smi| grep Default | grep -Eo '[0-9]+MiB' | head -n1} / ${exec nvidia-smi| grep Default | grep -Eo '[0-9]+MiB' | tail -n1}
${color #b18cff}GPU:   $color ${lua_parse sparkline_exec ~/.config/conky/getGPUpct.sh 100 "" % 27}
${color #b18cff}Power:$color ${lua_parse bargraph_exec ~/.config/conky/getGPUPower.sh 350 25 "" W}

${color #a78bfa}Wi-Fi ${hr 1}
${color #b8b3cc}Wireless signal: $color${wireless_link_qual wlan0}%
${color #b8b3cc}IP address: $color${addr wlan0}
${color #b8b3cc}Download speed: $color${downspeed wlan0}/sec
${downspeedgraph wlan0}
${color #b18cff}Downloaded: $color${totaldown wlan0} $alignr ${color green}Uploaded: $color${totalup wlan0}

${color #a78bfa}Battery ${hr 1}
${color #b18cff}Battery 0:$color ${battery_percent BAT0}% ${battery_bar 10 BAT0} 
     Draw: ${battery_power_draw BAT0}W 
Time left: ${battery_time BAT0}
${color #b18cff}Battery 1:$color ${battery_percent BAT1}% ${battery_bar 10 BAT1} 
     Draw: ${battery_power_draw BAT1}W 
Time left: ${battery_time BAT1}
]]
