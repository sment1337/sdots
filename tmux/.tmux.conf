# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Bindings -------------------------------------------------
# source tmux conf
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
# edit configuration
bind e new-window -n "~/.tmux.conf" sh -c '${EDITOR:-vim} -u ~/.vim/.vimrc ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display "~/.tmux.conf sourced"'

# floating popup windows
bind h display-popup -E "ssh smac"
#bind C-h display-popup -h 75% -w 75% -E "sudo htop"
bind C-h split-window "sudo htop"
bind C-i display-popup -E "sudo iftop -i enp2s0f0 -B"
#bind m display-popup -h 75% -w 75% -E "btop"
#bind m split-window "btop"
bind m split-window -v -d -p 50 -c "#{pane_current_path}" "btop" \; swap-pane -U
#bind C-o display-popup -h 75% -w 75% -E "sh $HOME/sdots/tmux/OpenNote.sh"
bind C-o split-window "sh $HOME/sdots/tmux/OpenNote.sh"
bind O display-popup -h 75% -w 75% -E "sh $HOME/sdots/tmux/OpenPDF.sh"
#bind B split-window 'find "$HOME/DripBox/iCloudDocs/Literature/EE Design Books" -depth | fzf --bind "enter:preview(zathura {})"'
bind-key C-j resize-pane -D 1
bind-key C-k resize-pane -U 1
bind-key C-l resize-pane -R 1
bind-key C-h resize-pane -L 1
set -g mouse on                    # enable mouse mode globally
bind M set -gF mouse '#{?mouse,off,on}' \; display "mouse: #{?mouse,on,off}"


#grep -rnw 'resilio/folders/DripBox/QownNotes' -e '[Gg]rep' | fzf | cut -d":" -f1,2 | IFS=: read -r v1 v2 && vim -u ~/.vim/.vimrc +$v2 "$v1"


# Set vim keys
setw -g mode-keys vi


# ============================================================
# Fancy upgrade (added by pi) — edit freely
# ============================================================

# Status bar colours
set -g status-style "bg=colour235,fg=colour245"
setw -g window-status-style "fg=colour245"
setw -g window-status-current-style "fg=colour191,bold"
setw -g window-status-current-format " #I #[fg=colour238]#W#{?window_zoomed_flag,\" [z]\",\"\"} "
setw -g window-status-format " #I #[fg=colour240]#W#{?window_zoomed_flag,\" [z]\",\"\"} "
# Live system stats — scripts/sysstats.sh daemon rewrites status-right
# every 5s (cpu/gpu sparklines, ram, battery + time left). Sparkline
# history lives in ~/.cache/tmux-sysstats/.
set -g status-right 'cpu -  gpu -  ram -'
set -g status-right-length 0   # 0 = use natural width, never clip the battery time
set -g status-justify left   # classic layout: session name + window list on the left
run-shell -b "$HOME/sdots/tmux/scripts/sysstats.sh daemon"

# Click the status bar (e.g. the clock) to hide it: the bar shrinks to a
# stub and all stats sampling stops. Click the stub to bring it back.
set -g @status_hidden 0
# Window switching by clicking the bar:
#  - click a window title  -> switch to that window (tmux built-in)
#  - click the session name -> go to the next window (only if >1 window)
bind -n MouseDown1StatusLeft if -F "#{>=:#{window_count},2}" next-window
# Hide/show the stats: right-click (two-finger right-tap) the clock.
# The clock itself stays purely informational and is always visible;
# hidden mode leaves just the clock in the right section.
bind -n MouseDown3StatusRight display-menu -t = -x R -y W -T "status bar" "#{?@status_hidden,Show,Hide} stats" t { run-shell 'tmux set -g @status_hidden "#{?@status_hidden,0,1}"; "$HOME/sdots/tmux/scripts/sysstats.sh" tick' }

# drop the default "[session]" brackets at bottom-left (that 0 was the
# session name, not a window number)
set -g status-left "#{session_name} "

# Per-pane top border (nice with multiple panes)
set -g pane-border-status top
set -g pane-border-format " #I:#P "

# Sane numbering / misc
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# Splits/new windows: keep current path, auto-even layout
# classic splits (no auto-relayout, so the direction is always what you see):
# % and | -> side by side (vertical divider); " and - -> stacked (horizontal divider)
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind * new-pane -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Cycle to previous window
bind Tab last-window

# fzf fuzzy navigation
bind W run "tmux list-windows -F '#I #W' | fzf --height=40% | awk '{print \$1}' | xargs -I{} tmux select-window -t \"\${PWD%%/*} {}\""
bind S run "tmux list-sessions -F '#S' | fzf --height=40% | xargs tmux switch-client -t"

# Run current pane command in a new window (session copy)
bind C-c send-keys "copysession \"$(tmux display -p '#{pane_current_command}')\" "
