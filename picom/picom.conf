#=============================================================#
#  picom 13 — "liquid glass" config (violet)                  #
#                                                             #
#  Uses the v12+ window-rule format (`rules`) and the         #
#  animation script system (`animations`). Legacy options     #
#  (wintypes, opacity-rule, *-exclude, ...) are NOT set,      #
#  so the rules engine is fully in charge.                    #
#=============================================================#

# ---------- backend ----------
backend = "glx";
vsync = true;
use-damage = true;
# dithering is too expensive for Xvnc's software rendering — leave off over VNC
# dithered-present = true;

# ---------- shadows ----------
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-color = "#14082b";     # deep violet shadow instead of flat black

# ---------- corners ----------
corner-radius = 14;

# ---------- blur (the actual liquid glass) ----------
# NOTE: over VNC the GL pipeline is software-rendered (llvmpipe), so blur is
# CPU-expensive. Keep strength low and blur only rarely-changing windows
# (conky, rofi). Do NOT blur terminals — they repaint on every keystroke.
blur-method = "dual_kawase";
blur-strength = 4;
blur-deviation = 1.2;
# blur-background is enabled per-window in rules below.

# ---------- misc ----------
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# ---------- window rules ----------
# Applied in order; the last matching rule wins per option,
# so the general "dim unfocused" baseline comes first and
# specific rules below override it where needed.
rules: ({
  # fullscreen windows: square corners, no shadow, no blur
  match = "fullscreen";
  corner-radius = 0;
  shadow = false;
  blur-background = false;
}, {
  match = "fullscreen";
  corner-radius = 0;
  shadow = false;
  blur-background = false;
}, {
  # docks & desktop windows (polybar, planks, wallpaper tools)
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
  blur-background = false;
  dim = 0;
}, {
  # rofi: the glass overlay — semi-transparent + blurred
  match = "class_g = 'Rofi'";
  opacity = 0.80;
  blur-background = true;
  blur-opacity = 0.85;
  shadow = true;
  corner-radius = 16;
  dim = 0;
}, {
  # conky: floating translucent HUD panel
  match = "class_g = 'Conky'";
  opacity = 0.78;
  blur-background = true;
  shadow = false;
  corner-radius = 16;
  dim = 0;
}, {
  # polybar: transparent (blur off — script updates every second would
  # force constant re-blur over software GL)
  match = "class_g = 'Polybar'";
  opacity = 0.85;
  blur-background = false;
}, {
  # menus / popups / tooltips: crisp, no blur, slightly rounded
  match = "window_type = 'menu' || window_type = 'dropdown_menu' || "
          "window_type = 'popup_menu' || window_type = 'utility' || "
          "window_type = 'tooltip' || window_type = 'notification'";
  shadow = false;
  blur-background = false;
  corner-radius = 8;
  dim = 0;
})

# ---------- animations ----------
# NOTE: when animations run, `fading` is ignored for those triggers,
# so this fully replaces fade-in/out for open/close/hide/show.
animations = ({
  triggers = ["open"];
  preset = "appear";
  scale = 0.92;                 # grow + fade in — soft glass materialise
  duration = 0.30;
}, {
  triggers = ["close"];
  preset = "disappear";
  scale = 0.92;
  duration = 0.20;
}, {
  triggers = ["show"];
  preset = "slide-in";
  direction = "up";
  duration = 0.25;
}, {
  triggers = ["hide"];
  preset = "slide-out";
  direction = "up";
  duration = 0.20;
})
